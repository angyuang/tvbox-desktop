[package]
name = "tvbox-desktop-tauri"
version = "1.3.0"
description = "TVBox Desktop 重写版：Tauri 2 + Rust + React"
authors = ["you"]
edition = "2021"

[lib]
name = "tvbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
  "brotli",
  "json",
] }
encoding_rs = "0.8"
regex = "1"
scraper = "0.20"
thiserror = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
